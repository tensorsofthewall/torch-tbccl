[build-system]
# torch is needed at build time (headers + cpp_extension), so build with
# --no-build-isolation (uv: see [tool.uv] below).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-tbccl"
dynamic = ["version"]
description = "Out-of-tree PyTorch distributed backend ('tbccl') over an installed TBCCL runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sandesh Bharadwaj" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
]
requires-python = ">=3.13,<3.14"  # the tested tuple: CPython 3.13 (the compiled extension is a cp313 module anyway)
# The compiled extension is tied to one torch minor series (see torch_tbccl/_version.py); import fails with a rebuild hint on a mismatch.
dependencies = ["torch>=2.13,<2.14"]

[project.urls]
Documentation = "https://torch-tbccl.tensorsofthewall.com/"
Repository = "https://github.com/tensorsofthewall/torch-tbccl"
Issues = "https://github.com/tensorsofthewall/torch-tbccl/issues"

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools]
packages = ["torch_tbccl"]

[tool.setuptools.dynamic]
version = { attr = "torch_tbccl._version.__version__" }

[tool.uv]
no-build-isolation-package = ["torch-tbccl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "multiprocess: spawns one process per rank on loopback",
    "cuda: needs a CUDA device and a CUDA-enabled torch-tbccl build",
    "mps: needs a macOS MPS device and an MPS-enabled torch-tbccl build",
    "ddp: runs a real DistributedDataParallel workload",
    "packaging: builds and inspects wheels / installs into clean environments (slow; needs TBCCL_ROOT)",
    "physical: touches the Thunderbolt link or a second host; never part of a generic run",
]
